name: CI and Mock Gallery

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: mock-gallery-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  checks-and-screenshots:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      - name: Go tests
        run: GOCACHE="$GITHUB_WORKSPACE/.cache/go-build" go test ./cmd/server ./internal/...
      - uses: pnpm/action-setup@v4
        with:
          version: 11.21.0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: web/pnpm-lock.yaml
      - name: Install web dependencies
        run: pnpm --dir web install --frozen-lockfile
      - name: Build mock web app
        run: pnpm --dir web build
        env:
          VITE_MOCK_API: 'true'
          PROXY_GO_GIT_SHA: ${{ github.sha }}
      - name: Install screenshot tooling
        working-directory: scripts/ci/web
        run: npm install --no-package-lock
      - name: Install Chromium
        working-directory: scripts/ci/web
        run: npx playwright install --with-deps chromium
      - name: Capture every page and operation
        run: bash scripts/ci/verify-mock-pages.sh
      - name: Upload screenshot artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: proxy-go-mock-gallery
          path: mock-page-artifacts/
          retention-days: 14
      - name: Upload GitHub Pages artifact
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: actions/upload-pages-artifact@v3
        with:
          path: mock-page-artifacts/site

  deploy-pages:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: checks-and-screenshots
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy Mock Gallery
        id: deployment
        uses: actions/deploy-pages@v4
      - name: Publish URL in summary
        run: echo "Mock 功能与截图页面：${{ steps.deployment.outputs.page_url }}" >> "$GITHUB_STEP_SUMMARY"
