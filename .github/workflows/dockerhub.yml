name: CI, Documentation and Deploy

on:
  pull_request:
  push:
    branches:
      - main
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  validate:
    name: Code checks
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache: true

      - name: Check Go formatting
        shell: bash
        run: |
          set -euo pipefail
          git ls-files -z '*.go' | xargs -0 -r gofmt -l | tee /tmp/gofmt-files
          test ! -s /tmp/gofmt-files

      - name: Run Go static checks
        env:
          GOCACHE: ${{ github.workspace }}/.cache/go-build
        run: go vet ./cmd/server ./internal/...

      - name: Run Go tests
        env:
          GOCACHE: ${{ github.workspace }}/.cache/go-build
        run: go test ./cmd/server ./internal/...

      - name: Set up pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 11.21.0

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: web/pnpm-lock.yaml

      - name: Install frontend dependencies
        working-directory: web
        run: pnpm install --frozen-lockfile

      - name: Check frontend types
        working-directory: web
        run: pnpm exec tsc --noEmit

      - name: Build frontend
        working-directory: web
        run: pnpm exec vite build

  container:
    name: Container and startup validation
    needs: validate
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Build validation image
        uses: docker/build-push-action@v7
        with:
          context: .
          file: ./Dockerfile.amd64
          platforms: linux/amd64
          load: true
          push: false
          tags: proxy-go:ci-${{ github.sha }}
          build-args: |
            PROXY_GO_GIT_SHA=${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Smoke test bundled services
        shell: bash
        env:
          TEST_IMAGE: proxy-go:ci-${{ github.sha }}
        run: ./scripts/ci-smoke-services.sh "${TEST_IMAGE}"

      - name: Validate fresh and existing database startup
        shell: bash
        env:
          TEST_IMAGE: proxy-go:ci-${{ github.sha }}
        run: ./scripts/ci-smoke-startup.sh "${TEST_IMAGE}"

  documentation:
    name: Build and verify project documentation
    needs: validate
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v6
        with:
          version: 11.21.0
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: web/pnpm-lock.yaml
      - name: Install web dependencies
        run: pnpm --dir web install --frozen-lockfile
      - name: Build mock web app
        run: pnpm --dir web build
        env:
          VITE_MOCK_API: 'true'
          PROXY_GO_GIT_SHA: ${{ github.sha }}
      - name: Install screenshot tooling
        working-directory: scripts/ci/web
        run: npm ci
      - name: Install Chromium
        working-directory: scripts/ci/web
        run: npx playwright install --with-deps chromium
      - name: Capture desktop pages and build documentation
        run: bash scripts/ci/verify-mock-pages.sh
      - name: Upload screenshot artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: proxy-go-documentation
          path: mock-page-artifacts/
          retention-days: 14
      - name: Upload GitHub Pages artifact
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: actions/upload-pages-artifact@v3
        with:
          path: mock-page-artifacts/site

  publish:
    name: Build and publish image
    needs: [container, documentation]
    if: github.event_name != 'pull_request' && (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v'))
    runs-on: ubuntu-latest
    env:
      DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
      DOCKERHUB_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Verify Docker Hub credentials
        shell: bash
        run: |
          set -euo pipefail
          test -n "${DOCKERHUB_USERNAME}" || { echo "DOCKERHUB_USERNAME is not configured" >&2; exit 1; }
          test -n "${DOCKERHUB_TOKEN}" || { echo "DOCKERHUB_TOKEN is not configured" >&2; exit 1; }

      - name: Login to Docker Hub
        uses: docker/login-action@v4
        with:
          username: ${{ env.DOCKERHUB_USERNAME }}
          password: ${{ env.DOCKERHUB_TOKEN }}

      - name: Extract Docker metadata
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ env.DOCKERHUB_USERNAME }}/proxy-go
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=ref,event=tag
            type=sha,prefix=sha-

      - name: Build and push
        uses: docker/build-push-action@v7
        with:
          context: .
          file: ./Dockerfile.amd64
          platforms: linux/amd64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            PROXY_GO_GIT_SHA=${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy:
    name: Deploy
    needs: publish
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    env:
      DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
      DEPLOY_PORT: ${{ secrets.DEPLOY_PORT || '22' }}
      DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
      DEPLOY_SCRIPT: ${{ secrets.DEPLOY_SCRIPT || '/root/proxy-go/deploy.sh' }}
      DEPLOY_SSH_PRIVATE_KEY: ${{ secrets.DEPLOY_SSH_PRIVATE_KEY }}

    steps:
      - name: Verify deployment credentials
        shell: bash
        run: |
          set -euo pipefail
          test -n "${DEPLOY_HOST}" || { echo "DEPLOY_HOST is not configured" >&2; exit 1; }
          test -n "${DEPLOY_USER}" || { echo "DEPLOY_USER is not configured" >&2; exit 1; }
          test -n "${DEPLOY_SSH_PRIVATE_KEY}" || { echo "DEPLOY_SSH_PRIVATE_KEY is not configured" >&2; exit 1; }

      - name: Deploy on server
        shell: bash
        run: |
          set -euo pipefail

          mkdir -p ~/.ssh
          chmod 700 ~/.ssh

          ssh-keyscan -p "${DEPLOY_PORT}" -H "${DEPLOY_HOST}" >> ~/.ssh/known_hosts
          chmod 600 ~/.ssh/known_hosts

          eval "$(ssh-agent -s)"
          trap 'ssh-agent -k >/dev/null' EXIT
          printf '%s\n' "${DEPLOY_SSH_PRIVATE_KEY}" | ssh-add -

          ssh \
            -p "${DEPLOY_PORT}" \
            -o BatchMode=yes \
            -o StrictHostKeyChecking=yes \
            "${DEPLOY_USER}@${DEPLOY_HOST}" \
            "bash '${DEPLOY_SCRIPT}'"

  deploy-pages:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: [container, documentation]
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy project documentation
        id: deployment
        uses: actions/deploy-pages@v4
      - name: Publish URL in summary
        run: echo "项目文档：${{ steps.deployment.outputs.page_url }}" >> "$GITHUB_STEP_SUMMARY"
